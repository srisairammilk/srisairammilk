name: Build SRI SAIRAM MILK APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Capacitor project
        run: |
          mkdir -p www
          cp index.html style.css app.js manifest.json icon.svg www/

          cat > package.json <<'EOF'
          {
            "name": "sri-sairam-milk",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "echo Build complete"
            },
            "dependencies": {
              "@capacitor/android": "^7.4.0",
              "@capacitor/core": "^7.4.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.0"
            }
          }
          EOF

          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.srisairammilk.app',
            appName: 'SRI SAIRAM MILK',
            webDir: 'www'
          };

          export default config;
          EOF

          npm install
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SRI-SAIRAM-MILK-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
